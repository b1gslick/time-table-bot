replicaCount: 1

image:
  repository: t1mon1106/time-table-bot
  tag: main
  pullPolicy: Always
  pullSecrets: []

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080

env:
  superAdminUsername: tim1106
  timezone: Europe/Nicosia
  databaseUrl:
    value: ""
    secretName: ""
    secretKey: ""
  telegramBotToken:
    secretName: time-table-bot-secrets
    secretKey: telegram-bot-token
  qwen:
    model: qwen3.7-plus
    baseUrl: ""
    baseUrlSecret:
      secretName: ""
      secretKey: QWEN_BASE_URL
    apiKey:
      secretName: ""
      secretKey: QWEN_API_KEY
  whisper:
    modelPath: /models/ggml-base-q5_1.bin
    cliPath: /usr/local/bin/whisper-cli
    ffmpegPath: /usr/bin/ffmpeg
    threads: 2

postgres:
  image: postgres:16
  host: postgres
  port: 5432
  user: timetable
  db: timetable
  passwordSecret:
    name: time-table-bot-secrets
    key: postgres-password
  persistence:
    storageClass: local-storage
    size: 20Gi
    hostPath:
      enabled: false
      path: /mnt/pv-data/time-table-bot-postgres

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
