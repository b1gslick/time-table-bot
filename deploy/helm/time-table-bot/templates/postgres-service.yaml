apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "time-table-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "time-table-bot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
