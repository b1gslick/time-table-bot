apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "time-table-bot.fullname" . }}
  labels:
    {{- include "time-table-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "time-table-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "time-table-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "time-table-bot.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.telegramBotToken.secretName }}
                  key: {{ .Values.env.telegramBotToken.secretKey }}
            - name: SUPER_ADMIN_USERNAME
              value: {{ .Values.env.superAdminUsername | quote }}
            - name: TIMEZONE
              value: {{ .Values.env.timezone | quote }}
            - name: QWEN_MODEL
              value: {{ .Values.env.qwen.model | quote }}
            {{- if .Values.env.qwen.baseUrlSecret.secretName }}
            - name: QWEN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.qwen.baseUrlSecret.secretName }}
                  key: {{ .Values.env.qwen.baseUrlSecret.secretKey }}
            {{- else if .Values.env.qwen.baseUrl }}
            - name: QWEN_BASE_URL
              value: {{ .Values.env.qwen.baseUrl | quote }}
            {{- end }}
            {{- if .Values.env.qwen.apiKey.secretName }}
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.qwen.apiKey.secretName }}
                  key: {{ .Values.env.qwen.apiKey.secretKey }}
            {{- end }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
            {{- if .Values.env.databaseUrl.secretName }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseUrl.secretName }}
                  key: {{ .Values.env.databaseUrl.secretKey }}
            {{- else if .Values.env.databaseUrl.value }}
            - name: DATABASE_URL
              value: {{ .Values.env.databaseUrl.value | quote }}
            {{- else }}
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
