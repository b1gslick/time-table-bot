---
name: Build

permissions:
  contents: read
  checks: write
  id-token: write

on:
  - push
  - workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu:latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Run Postgres integration tests
        run: go test -tags=integration ./internal/store
      - name: Run bot app integration tests
        run: go test -tags=integration ./cmd/time-table-bot

  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: self-hosted
    timeout-minutes: 180
    needs:
      - test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: b1gslick/time-table-bot
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }},b1gslick/time-table-bot:latest
          labels: ${{ steps.meta.outputs.labels }}
