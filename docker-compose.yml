services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetable}
      POSTGRES_DB: ${POSTGRES_DB:-timetable}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetable} -d ${POSTGRES_DB:-timetable}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-timetable}:${POSTGRES_PASSWORD:-timetable}@postgres:5432/${POSTGRES_DB:-timetable}?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-tim1106}
      TIMEZONE: ${TIMEZONE:-Europe/Nicosia}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
